services:
  auth:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file:
      - .env
    environment:
      - POSTGRES_ENDPOINT_URL=postgres://postgres:postgres@postgres:5432/auth
    ports:
      - "3000:3000"

  postgres:
    image: postgres:18.1
    restart: always
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./flyway/postgresql:/var/lib/postgresql

  flyway-postgres:
    build:
      context: .
      dockerfile: docker/flyway.Dockerfile
    command: ["migrate"]
    environment:
      - FLYWAY_URL=jdbc:postgresql://postgres:5432/postgres
      - FLYWAY_SCHEMAS=public
      - FLYWAY_USER=postgres
      - FLYWAY_PASSWORD=postgres
      - FLYWAY_CONNECT_RETRIES=60
    # Mount host directory for hot-reload during local development
    # This overrides the /flyway/sql copied in Dockerfile with postgres-specific migrations
    volumes:
      - ./flyway/sql/postgres:/flyway/sql
    depends_on:
      - postgres

  flyway-auth:
    build:
      context: .
      dockerfile: docker/flyway.Dockerfile
    command: ["migrate"]
    environment:
      - FLYWAY_URL=jdbc:postgresql://postgres:5432/auth
      - FLYWAY_SCHEMAS=public
      - FLYWAY_USER=postgres
      - FLYWAY_PASSWORD=postgres
      - FLYWAY_CONNECT_RETRIES=60
    # Mount host directory for hot-reload during local development
    # This overrides the /flyway/sql copied in Dockerfile with auth-specific migrations
    volumes:
      - ./flyway/sql/auth:/flyway/sql
    depends_on:
      - postgres
      - flyway-postgres
